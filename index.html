<!DOCTYPE html>
<html>
    <head>

        <base href="/">

        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
        <link rel="stylesheet" href="styles.css?v=76">
        <link rel="icon" href="favicon.ico" type="image/x-icon">
        <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">


        <title>GooseMarshal.com</title>

    </head>
    <body>

        <nav class="navbar navbar-expand-sm" style="background-color: #FBCD5E; width: 100%;">
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                    <div class="navbar-nav">
                    <a class="nav-link active" aria-current="page" href="/">Home</a>
                    <a class="nav-link" href="/poetry">Poetry</a>
                    <a class="nav-link" href="/blog">Blog</a>
                    <a class="nav-link" href="/faq">FAQs</a>
                    <a class="nav-link" href="/about">About</a>
                    </div>
                </div>
            </div>
        </nav>

        <h1 class="page-title">GooseMarshal.com</h1>
        <div class="page-body">
            <div class="img-slider-container">
                <img class="goose-img" src="goosemarshal.jpg" alt="Goose">
                <div class="sliders">
                    <div class="form-group">
                        <label for="volume_slider">Volume:</label>
                        <input type="range" class="form-control-range" id="volume_slider" min="-60" max="0" step="1" value="-20">
                    </div>
                    <div class="form-group">
                        <label for="reverb_slider">Reverb:</label>
                        <input type="range" class="form-control-range" id="reverb_slider" min="0" max="1" step="0.01" value="0">
                    </div>
                    <div class="form-group">
                        <label for="dist_slider">Distortion:</label>
                        <input type="range" class="form-control-range" id="dist_slider" min="0" max="1" step="0.01" value="0">
                    </div>
                    <div class="form-group">
                        <label for="pitch_slider">Pitch:</label>
                        <input type="range" class="form-control-range" id="pitch_slider" min="-24" max="24" step="1" value="0">
                    </div>
                    <div class="form-group">
                        <label for="rate_slider">Honk Rate:</label>
                        <input type="range" class="form-control-range" id="rate_slider" min="0.2" max="2" step="0.01" value="1">
                    </div>
                </div>
            </div>
                <div class="button-div">
                    <button id="honk_button" class="honk-button">Honk!</button>

                    <div class="container">
                        <div id="popup" class="popup"></div>
                    </div>
                </div>
            <div class="honk-hall">
                <table class="table table-borderless">
                    <thead>
                        <tr>
                            <th>
                                <h2 style="font-family:Pacifico;">Honks of Fame</h2>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>
                                <button type="button" id="balrog" class="btn btn-outline-danger hof-button">Balrog</button>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <button type="button" id="war-worlds" class="btn btn-outline-dark hof-button">UFO</button>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <button type="button" id="grizzly" class="btn btn-outline-info hof-button grizzly">Grizzly</button>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <button type="button" id="default" class="btn btn-outline-secondary hof-button">Default</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js" integrity="sha512-jduERlz7En1IUZR54bqzpNI64AbffZWR//KJgF71SJ8D8/liKFZ+s1RxmUmB+bhCnIfzebdZsULwOrbVB5f3nQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
        <script src="honk-button.js?v=25"></script>

    </body>
</html>
